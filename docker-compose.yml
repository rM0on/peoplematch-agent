name: peoplematch-agent

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peoplematch}
      POSTGRES_USER: ${POSTGRES_USER:-peoplematch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peoplematch_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-peoplematch} -d ${POSTGRES_DB:-peoplematch}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-PeopleMatch Agent Backend}
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-peoplematch}
      POSTGRES_USER: ${POSTGRES_USER:-peoplematch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peoplematch_local}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://peoplematch:peoplematch_local@postgres:5432/peoplematch}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-mock}
      EXTRACTION_MAX_ATTEMPTS: ${EXTRACTION_MAX_ATTEMPTS:-2}
      EXTRACTION_TIMEOUT_SECONDS: ${EXTRACTION_TIMEOUT_SECONDS:-10}
      RETRIEVAL_EMBEDDING_PROVIDER: ${RETRIEVAL_EMBEDDING_PROVIDER:-sentence_transformers}
      RETRIEVAL_EMBEDDING_MODEL: ${RETRIEVAL_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      RETRIEVAL_EMBEDDING_DIMENSION: ${RETRIEVAL_EMBEDDING_DIMENSION:-384}
      RETRIEVAL_CANDIDATE_COLLECTION: ${RETRIEVAL_CANDIDATE_COLLECTION:-peoplematch_candidates_retrieval_v1}
      RETRIEVAL_JOB_COLLECTION: ${RETRIEVAL_JOB_COLLECTION:-peoplematch_jobs_retrieval_v1}
      RETRIEVAL_RRF_K: ${RETRIEVAL_RRF_K:-60}
      RETRIEVAL_BM25_K1: ${RETRIEVAL_BM25_K1:-1.5}
      RETRIEVAL_BM25_B: ${RETRIEVAL_BM25_B:-0.75}
      RETRIEVAL_POOL_MINIMUM: ${RETRIEVAL_POOL_MINIMUM:-20}
      RETRIEVAL_POOL_MULTIPLIER: ${RETRIEVAL_POOL_MULTIPLIER:-3}
      RANKING_MODEL_PATH: /app/artifacts/phase6/ltr_ranker_v1.txt
      RANKING_MODEL_METADATA_PATH: /app/data/eval/phase6/ltr_model_metadata_v1.json
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./data/eval/phase6:/app/data/eval/phase6:ro
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
